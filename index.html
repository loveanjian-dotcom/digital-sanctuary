<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="栖 · Digital Sanctuary — 一个可以安静待着的数字空间">
<meta name="theme-color" content="#04060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="栖">
<title>栖 · Digital Sanctuary</title>
</head>
<body>

<canvas id="world"></canvas>

<div id="veil">
  <h1>栖</h1>
  <p>DIGITAL SANCTUARY</p>
  <button id="enter">进 入</button>
</div>

<div id="scene-name"></div>
<div id="hint">触碰 · 或轻轻倾斜这个世界</div>

<div id="mixer">
  <h3>声 音</h3>
  <div id="tracks"></div>
</div>

<div id="dock">
  <button class="scene-btn" data-scene="rain" title="雨夜">
    <svg viewBox="0 0 24 24"><path d="M18 11a5 5 0 0 0-9.6-1.7A4 4 0 0 0 8 17h9a3 3 0 0 0 1-6z"/><line x1="8" y1="19.5" x2="7.2" y2="21.5"/><line x1="12" y1="19.5" x2="11.2" y2="21.5"/><line x1="16" y1="19.5" x2="15.2" y2="21.5"/></svg>
  </button>
  <button class="scene-btn" data-scene="snow" title="雪夜">
    <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><line x1="4.2" y1="7.5" x2="19.8" y2="16.5"/><line x1="19.8" y1="7.5" x2="4.2" y2="16.5"/><path d="M12 3l-2 2m2-2 2 2M12 21l-2-2m2 2 2-2"/></svg>
  </button>
  <button class="scene-btn" data-scene="fire" title="壁炉">
    <svg viewBox="0 0 24 24"><path d="M12 21c4 0 6.5-2.6 6.5-6 0-3-2-5-3.5-7-.4 1.6-1 2.4-2 3 .3-2.6-.6-5.6-3-8-.3 3-1.6 4.6-3 6.4C5.7 11 5.5 12.6 5.5 15c0 3.4 2.5 6 6.5 6z"/><path d="M12 21c-1.8 0-3-1.3-3-3 0-1.5 1-2.4 2-3.6.8 1 2.2 1.4 2.2 1.4S14 16 14 17.4c0 2-1 3.6-2 3.6z"/></svg>
  </button>
  <button class="scene-btn" data-scene="ocean" title="月海">
    <svg viewBox="0 0 24 24"><path d="M2 15c2 0 2-1.6 4-1.6S8 15 10 15s2-1.6 4-1.6 2 1.6 4 1.6 2-1.6 4-1.6"/><path d="M2 19.5c2 0 2-1.6 4-1.6s2 1.6 4 1.6 2-1.6 4-1.6 2 1.6 4 1.6 2-1.6 4-1.6"/><circle cx="17" cy="6.5" r="2.6"/></svg>
  </button>
  <button class="scene-btn" data-scene="stars" title="星河">
    <svg viewBox="0 0 24 24"><path d="M12 4.5l1.6 3.6 3.9.4-2.9 2.6.8 3.9L12 13l-3.4 2 .8-3.9-2.9-2.6 3.9-.4z"/><line x1="19.5" y1="4" x2="19.5" y2="7"/><line x1="18" y1="5.5" x2="21" y2="5.5"/><line x1="5" y1="17" x2="5" y2="19.6"/><line x1="3.7" y1="18.3" x2="6.3" y2="18.3"/></svg>
  </button>
  <div class="divider"></div>
  <button class="icon-btn" id="fsBtn" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
  </button>
  <button class="icon-btn" id="mixBtn" title="声音">
    <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2.1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.1" fill="currentColor" stroke="none"/><circle cx="7" cy="18" r="2.1" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="icon-btn on" id="muteBtn" title="静音">
    <svg id="volOn" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg id="volOff" viewBox="0 0 24 24" style="display:none"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="21" y2="14"/><line x1="21" y1="9" x2="16" y2="14"/></svg>
  </button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
